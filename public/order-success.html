<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Order Confirmation | Visalatchi Super Market</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@500;600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<header class="site-header">
    <div class="container header-top">
        <a href="index.html" class="logo">
            <img src="images/logo.png" alt="Visalatchi Super Market Logo" class="logo-img">
            <div class="logo-text">
                <span class="logo-name">VISALATCHI</span>
                <span class="logo-tagline">SUPER MARKET</span>
            </div>
        </a>
        <div class="header-actions">
            <button class="hamburger-btn" aria-label="Open menu">☰</button>
            <a href="my-orders.html" class="my-orders-btn" id="headerMyOrdersBtn">📦 My Orders</a>
            <a href="products.html" class="btn btn-outline btn-sm">Shop</a>
            <div class="user-auth-wrap" id="userAuthWrap">
                <a href="admin.html" class="icon-btn" id="headerUserBtn" title="Sign In / Register" aria-label="Login">👤</a>
            </div>
        </div>
    </div>
</header>

<div class="mobile-nav-overlay"></div>
<div class="mobile-nav">
    <div class="mobile-nav-head">
        <div style="display:flex; align-items:center; gap:8px;">
            <img src="images/logo.png" alt="Logo" style="width:30px; height:30px; border-radius:50%; object-fit:cover; background:#000;">
            <span class="mobile-nav-title">Menu</span>
        </div>
        <button class="mobile-nav-close" aria-label="Close menu">✕</button>
    </div>
    <a href="index.html">🏠 Home</a>
    <a href="products.html">🗂️ Categories</a>
    <a href="products.html">🛍️ Products</a>
    <a href="my-orders.html">📦 My Orders</a>
    <a href="cart.html">🛒 My Cart</a>
    <a href="admin.html" class="mobile-nav-admin" id="mobileAuthLink">🔐 Sign In / Staff Login</a>
</div>

<section class="section">
    <div class="container">
        <div class="confirmation-box" id="confirmationBox">
            <div class="confirmation-icon">✓</div>
            <h2>Loading your order...</h2>
        </div>
    </div>
</section>

<script src="js/app.js"></script>
<script>
document.addEventListener('DOMContentLoaded', async () => {
    const params = new URLSearchParams(window.location.search);
    const orderNumber = params.get('order');
    const box = document.getElementById('confirmationBox');

    if (!orderNumber) {
        box.innerHTML = `<h2>No order found</h2><p style="color:var(--text-muted); margin:12px 0;">We couldn't find an order to show.</p><a href="index.html" class="btn btn-primary">Go Home</a>`;
        return;
    }

    try {
        const data = await apiRequest(`${API_BASE}/orders/${orderNumber}`);
        const order = data.order;

        box.innerHTML = `
            <div class="confirmation-icon">✓</div>
            <h2>Order Placed Successfully!</h2>
            <p style="color:var(--text-muted); margin-top:6px;">Thank you for shopping with VISALATCHI SUPER MARKET.</p>
            <div class="order-id-box">
                Order ID: <strong>${escapeHtml(order.order_number)}</strong><br>
                Total: <strong>${formatPrice(order.total)}</strong><br>
                Delivery: <strong style="color:var(--green-mid);">FREE</strong><br>
                Status: <strong>${escapeHtml(order.status)}</strong>
            </div>
            <div style="display:flex; gap:12px; justify-content:center; flex-wrap:wrap;">
                <a href="products.html" class="btn btn-secondary">Continue Shopping</a>
                <a href="order-tracking.html?order=${escapeHtml(order.order_number)}" class="btn btn-primary">View Order</a>
            </div>
        `;
    } catch (err) {
        box.innerHTML = `<h2>Order not found</h2><p style="color:var(--text-muted); margin:12px 0;">Please check your order ID and try again.</p><a href="index.html" class="btn btn-primary">Go Home</a>`;
    }
});
</script>
</body>
</html>
